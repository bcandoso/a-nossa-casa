<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">ObraFlow</title>
  <desc id="desc">Local construction cash-flow monitor. Funding sources flow into budget categories and real expenses.</desc>
  <rect width="1200" height="420" rx="24" fill="#f5f8f9" stroke="#d3e1e5" stroke-width="1.5"/>
