<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">Funding flow</title>
  <desc id="flowDesc">Released tranches and equity feed budget categories, then actual expenses. Unspent funds sit in Disponivel.</desc>
